[project]
name = "kiki-console"
version = "0.1.0"
description = "Kiki's web console: per-server dashboards, costs, settings, prompts and chat"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.20",
    "uvicorn>=0.30",
]

[project.scripts]
kiki-console = "kiki_console.__main__:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
