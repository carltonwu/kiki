[project]
name = "kiki-sim"
version = "0.1.0"
description = "A local fake Discord (and OpenRouter) for testing Kiki end to end"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.12",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[project.scripts]
kiki-sim = "kiki_sim.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff>=0.17.1"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
