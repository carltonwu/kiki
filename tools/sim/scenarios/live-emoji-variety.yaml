  - add_emoji: {name: tannah, id: 900000000000005104, description: "a toddler's face up close with big dark eyes, a reaction the group spams"}
  - add_emoji: {name: oop, id: 900000000000005105, description: "glossy pursed lips, for 'oop', caught saying something"}
  - add_emoji: {name: bruh, id: 900000000000005106, description: "a young man's deadpan, bewildered stare, for an unimpressed bruh"}
  - add_emoji: {name: joyextremee, id: 900000000000005107, description: "a distorted wide-eyed duck screaming with joy, for extreme laughter"}
  - add_emoji: {name: seth_shock, id: 900000000000005108, description: "someone covering their mouth and staring, for shock or gasping at tea"}
