name: Kiki picks varied custom emoji from a realistic catalog
# Evidence for the emoji-variety change: run with `kiki-sim test --live` and
# count the distinct emoji in the transcript. 28 emoji like the friend group's
# server, prose lingo like theirs, and banter that invites reactions.
live: only
