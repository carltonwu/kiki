  - add_emoji: {name: crycat, id: 900000000000005110, description: "a white cat with huge teary eyes, for sad, touched or pleading"}
  - add_emoji: {name: grief_elevated, id: 900000000000005111, description: "a screaming yellow face with hands raised in despair, for dramatic anguish"}
  - add_emoji: {name: panik, id: 900000000000005112, description: "a 3D head clutching its temples, for panic"}
  - add_emoji: {name: OKAAYYY, id: 900000000000005113, description: "a confident older woman in a black dress, for 'okaaay' approval, slay"}
  - add_emoji: {name: ate, id: 900000000000005114, description: "someone slurping noodles intensely, for 'ate', they nailed it"}
  - add_emoji: {name: hairflip, id: 900000000000005115, description: "a black-and-white smirking hair flip, for sass and confidence"}
  - add_emoji: {name: sally, id: 900000000000005116, description: "a blonde woman in glasses with a smug, judgmental smirk, for smug side-eye"}
