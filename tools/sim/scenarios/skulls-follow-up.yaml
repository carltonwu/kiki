name: a doubtful "no" to Kiki's fresh conversation partner still continues
# Jev says a soft "no" (0.25) to something Ethan says to Kiki without "you" or a
# question, right after she answered him: the follow-up rescue continues it.
steps:
  - say: {as: ethan, in: general, text: "@kiki rate my lunch", id: start}
  - expect: {reply: true}
  - say: {as: ethan, in: general, text: "💀💀💀"}
    jev: {choice: "no", confidence: 0.9}
  - expect: {outcome: "no", reply: false}
  - say: {as: ethan, in: general, text: "ok rate it again but nicer"}
    jev: {choice: "no", confidence: 0.25}
  - expect: {outcome: continue, conversation: {same_as: start}, jev_choice: "no", reply: true}
