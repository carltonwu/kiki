# Local development database: docker compose up -d
name: kiki
services:
  postgres:
    image: pgvector/pgvector:pg18-trixie  # Postgres 18 + pgvector, like Railway's image
    # Railway's memory settings (ALTER SYSTEM there): small shared buffers, since
    # the OS page cache holds the same pages and Railway bills both.
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=100", "-c", "jit=off"]
    environment:
      POSTGRES_USER: kiki
      POSTGRES_PASSWORD: kiki
      POSTGRES_DB: kiki
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiki"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
