# Local development database: docker compose up -d
name: kiki
services:
  postgres:
    image: postgres:18  # matches Railway's managed Postgres
    environment:
      POSTGRES_USER: kiki
      POSTGRES_PASSWORD: kiki
      POSTGRES_DB: kiki
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiki"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
