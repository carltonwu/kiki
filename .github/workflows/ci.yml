# Checks every push and PR. On `main`, once every check passes, builds the
# images that changed, pushes them to GHCR and deploys them to Dokploy
# (docs/self-hosting.md). Run it by hand (workflow_dispatch) to rebuild and
# redeploy both services.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main mid-deploy; the next one waits its turn instead.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie # Postgres 18 + pgvector, like Railway's image
        env:
          POSTGRES_USER: kiki
          POSTGRES_PASSWORD: kiki
          POSTGRES_DB: kiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://kiki:kiki@localhost:5432/kiki
    steps:
      - uses: actions/checkout@v7
      # Grafana dashboards and alert rules: validate only (stdlib, no network).
      - run: tools/grafana/apply --dry-run
      - run: python3 -m unittest discover -s tools/grafana
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: services/agent/uv.lock
      - run: uv sync --project services/agent --locked
      - run: uv run --project services/agent --locked ruff check services/agent
      - run: uv run --project services/agent --locked ruff format --check services/agent
      - run: uv run --directory services/agent --locked pytest

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: kiki
          POSTGRES_PASSWORD: kiki
          POSTGRES_DB: kiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://kiki:kiki@localhost:5432/kiki
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # End-to-end: the real ingester and agent host against a fake Discord and stub
  # LLMs (tools/sim, docs/kiki-sim-hld.md).
  sim:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: kiki
          POSTGRES_PASSWORD: kiki
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 15
    env:
      KIKI_SIM_POSTGRES: postgres://kiki:kiki@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: |
            services/agent/uv.lock
            tools/sim/uv.lock
      # kiki-sim only touches a server that has this table.
      - run: psql "$KIKI_SIM_POSTGRES" -f tools/sim/initdb/00-sim-marker.sql
      - run: uv run --project tools/sim --locked ruff check tools/sim
      - run: uv run --project tools/sim --locked ruff format --check tools/sim
      - run: tools/sim/kiki-sim up
      - run: tools/sim/kiki-sim test -j 4
      - if: always()
        run: tools/sim/kiki-sim down --all
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs
          path: .sim/*/logs/

  iac:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .railway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .railway/package-lock.json
      - run: npm ci
      - run: npx tsc

  # Which services a push to main changes (Railway's watchPatterns, before).
  changes:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      ingester: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ingester == 'true' }}
      agent: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.agent == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ingester:
              - services/ingester/**
              - Cargo.toml
              - Cargo.lock
            agent:
              - services/agent/**

  images:
    needs: [changes, python, rust, sim, iac]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [ingester, agent]
    steps:
      - id: changed
        run: echo "build=${{ needs.changes.outputs[matrix.service] }}" >> "$GITHUB_OUTPUT"
      - if: steps.changed.outputs.build == 'true'
        uses: actions/checkout@v7
      - if: steps.changed.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.changed.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.changed.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          build-args: KIKI_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/kiki-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/kiki-${{ matrix.service }}:main
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # Ingester first: it migrates on start, and the agent waits for the schema.
  deploy:
    needs: [changes, images]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to Dokploy
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/kiki
        run: |
          targets=()
          if [ "${{ needs.changes.outputs.ingester }}" = true ]; then
            targets+=("ingester=$IMAGE-ingester:$GITHUB_SHA")
          fi
          if [ "${{ needs.changes.outputs.agent }}" = true ]; then
            targets+=("agent=$IMAGE-agent:$GITHUB_SHA")
          fi
          if [ ${#targets[@]} -eq 0 ]; then
            echo "No service changed; nothing to deploy."
            exit 0
          fi
          tools/dokploy/deploy "${targets[@]}"
