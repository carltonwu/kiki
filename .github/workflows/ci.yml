# Checks every push and PR. Railway waits for these checks to pass on `main`
# before deploying (checkSuites in .railway/railway.ts).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie # Postgres 18 + pgvector, like Railway's image
        env:
          POSTGRES_USER: kiki
          POSTGRES_PASSWORD: kiki
          POSTGRES_DB: kiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://kiki:kiki@localhost:5432/kiki
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: services/agent/uv.lock
      - run: uv sync --project services/agent --locked
      - run: uv run --project services/agent --locked ruff check services/agent
      - run: uv run --project services/agent --locked ruff format --check services/agent
      - run: uv run --directory services/agent --locked pytest

  console:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: kiki
          POSTGRES_PASSWORD: kiki
          POSTGRES_DB: kiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://kiki:kiki@localhost:5432/kiki
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: services/console/uv.lock
      - run: uv sync --project services/console --locked
      - run: uv run --project services/console --locked ruff check services/console
      - run: uv run --project services/console --locked ruff format --check services/console
      - run: uv run --directory services/console --locked pytest

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: kiki
          POSTGRES_PASSWORD: kiki
          POSTGRES_DB: kiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://kiki:kiki@localhost:5432/kiki
    steps:
      - uses: actions/checkout@v7
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # End-to-end: the real ingester and agent host against a fake Discord and stub
  # LLMs (tools/sim, docs/kiki-sim-hld.md).
  sim:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18-trixie
        env:
          POSTGRES_USER: kiki
          POSTGRES_PASSWORD: kiki
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-retries 15
    env:
      KIKI_SIM_POSTGRES: postgres://kiki:kiki@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          enable-cache: true
          cache-dependency-glob: |
            services/agent/uv.lock
            tools/sim/uv.lock
      # kiki-sim only touches a server that has this table.
      - run: psql "$KIKI_SIM_POSTGRES" -f tools/sim/initdb/00-sim-marker.sql
      - run: uv run --project tools/sim --locked ruff check tools/sim
      - run: uv run --project tools/sim --locked ruff format --check tools/sim
      - run: tools/sim/kiki-sim up
      - run: tools/sim/kiki-sim test -j 4
      - if: always()
        run: tools/sim/kiki-sim down --all
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sim-logs
          path: .sim/*/logs/

  iac:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .railway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: .railway/package-lock.json
      - run: npm ci
      - run: npx tsc
